name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Data checks (schemas, integrity, business rules)
        run: npm run validate
      - name: Unit tests (roll rules, storage adapter, data contract)
        run: npm test
