<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mesa - a weekly meal planner (portfolio demo)</title>
  <meta name="description" content="Mesa plans a week of dinners, one shopping trip and packed lunches. A portfolio demo built with plain HTML, CSS and JavaScript on invented sample data.">
  <meta property="og:title" content="Mesa - a weekly meal planner">
  <meta property="og:description" content="Six dinners, one shopping list, packed lunches from leftovers. Plain HTML, CSS and JavaScript on sample data.">
  <meta property="og:image" content="https://myrelab.github.io/mesa-meal-planner/assets/social-preview.png">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#F4F1F8">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/figtree-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/young-serif-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <span class="eyebrow">
          <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="9" width="26" height="4.5" rx="2" fill="currentColor"/><path d="M8 13.5V25M24 13.5V25" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/></svg>
          <span id="eyebrow">Loading</span>
        </span>
      </div>
      <h1 id="title">Mesa</h1>
      <p class="sub" id="summary"></p>
      <div class="weeknav" id="weeknav"></div>
    </header>

    <nav class="tabs" aria-label="Planner sections">
      <a href="#week" data-tab="week">Week</a>
      <a href="#shop" data-tab="shop">Shop</a>
      <a href="#mon" data-tab="cook">Cook</a>
      <a href="#faves" data-tab="faves">Faves</a>
    </nav>

    <section class="view" id="v-week" aria-label="Week plan"></section>
    <section class="view" id="v-shop" aria-label="Shopping list" hidden></section>
    <section class="view" id="v-cook" aria-label="Recipe for the day" hidden></section>
    <section class="view" id="v-faves" aria-label="Favourites rotation" hidden></section>

    <footer class="demo-foot">
      <div class="row"><b>Portfolio demo.</b> Every meal, store and household here is invented sample data.</div>
      <details id="rules"></details>
      <div class="row">
        <a href="https://github.com/MyreLab/mesa-meal-planner">Source on GitHub</a>
        <button class="btn ghost small" id="reset-demo" type="button">Reset demo data</button>
      </div>
    </footer>
  </div>
  <noscript><p class="noscript">Mesa needs JavaScript to render the plan.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
